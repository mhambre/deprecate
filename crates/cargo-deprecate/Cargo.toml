[package]
name = "cargo-deprecate"
version = "1.0.1"
edition = "2021"
rust-version = "1.74"
authors = ["Matthew Hambrecht <hambrechtmatt@gmail.com>"]
description = "Cargo command for machine-readable Rust deprecations and migrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mhambre/deprecate"
readme = "README.md"
keywords = ["deprecation", "migration", "cargo", "refactoring", "codemod"]
categories = ["development-tools", "development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
cargo_metadata = { version = "=0.19.0", default-features = false }
# Keep cargo_metadata 0.19 compatible with the declared MSRV.
cargo-platform = "=0.1.8"
clap = { version = "=4.5.48", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
deprecate = { version = "1.0", path = "../..", features = ["serde"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
semver = "1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }

[dev-dependencies]
tempfile = { version = "3.27.0", default-features = false }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
