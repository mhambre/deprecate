[package]
name = "deprecate-macros"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
authors = ["Matthew Hambrecht <hambrechtmatt@gmail.com>"]
description = "Procedural macros for the deprecate lifecycle toolkit"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mhambre/deprecate"
readme = "README.md"
keywords = ["deprecation", "migration", "proc-macro", "semver", "attributes"]
categories = ["development-tools", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
semver = "1.0.28"
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing", "proc-macro"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
