[package]
name = "deprecate"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
authors = ["Matthew Hambrecht <hambrechtmatt@gmail.com>"]
description = "Machine-readable Rust deprecations and automatic migrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mhambre/deprecate"
readme = "README.md"
keywords = ["deprecation", "migration", "cargo", "refactoring", "semver"]
categories = ["development-tools", "development-tools::cargo-plugins", "rust-patterns"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["crates/cargo-deprecate", "crates/deprecate-macros"]
resolver = "2"

[lib]
path = "src/lib.rs"

[dependencies]
deprecate-macros = { version = "1.0.0", path = "crates/deprecate-macros" }
serde = { version = "=1.0.228", optional = true, features = ["derive"] }

[features]
serde = ["dep:serde"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
